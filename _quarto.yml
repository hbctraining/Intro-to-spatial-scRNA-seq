project:
  type: website
  output-dir: docs
  resources:
    - img/
    - css/
    - slides/
    - schedule/


website:
  title: "Spatial Transcriptomics"
  google-analytics: G-68JBPLLNLG
  page-footer: >
      This lesson has been developed by members of the teaching team at the [Harvard Chan Bioinformatics Core (HBC)](http://bioinformatics.sph.harvard.edu/).
  
  navbar:
    left:
      - text: "Schedule"
        href: schedule/schedule.qmd
    right:
      - text: "HBC"
        href: https://bioinformatics.sph.harvard.edu/
      - text: "GitHub"
        href: https://github.com/hbctraining/Intro-to-spatial-scRNA-seq/
      - text: "Contact us"
        href: mailto:hbctraining@hsph.harvard.edu
  
  
  sidebar:
    title: "Lessons"      # Optional title above the sidebar
    style: "docked"       # Sidebar is docked to the left
    collapse-level: 1     # At what header level to start collapsing
    # contents: auto      # Creates automatic TOC from page headers (no sections)
    contents:
    
      - section: "Pre-reading:"
        contents:
          - lessons/01_spatial_technologies.qmd
          - lessons/02_spaceranger.qmd


      - section: "Day 1:"
        contents:
          - lessons/03_loading_spatial_data.qmd
    
      - section: "Day 1 Self-learning:"
        contents:
          - lessons/04_theory_of_PCA.qmd
          - lessons/05_quality_control.qmd
          
      - section: "Day 2:"
        contents:
          - lessons/06_normalization_and_sketch.qmd
          - lessons/07_dim_reduction.qmd

      - section: "Day 2 Self-learning:"
        contents:
          - lessons/08_clustering.qmd
          - lessons/09_integration.qmd
          - lessons/10_seurat_cheatsheet.qmd
          
      - section: "Day 3:"
        contents:
          - lessons/11_banksy_clustering.qmd
          - lessons/12_deconvolution.qmd
          
      - section: "Day 3 Self-learning:"
        contents:
          - lessons/13_dge_pathway.qmd
          - lessons/14_svgs.qmd
          
      - section: "Day 4:"
        contents:
          - lessons/15_cellchat.qmd

format:
  html:
    theme: simplex
    css: css/styles.css
    fig-align: "center"
    toc: true
    number-sections: false
    code-block-bg: true
    code-copy: true      # enables copy button (default in most themes)
    code-tools: true     # enables the copy button!
    code-line-wrap: wrap
    google-analytics: G-68JBPLLNLG
    prompt: true         
    self-contained: true
    lightbox: true

# Global Execution Defaults
execute:
  echo: true               # show code
  eval: true               # run code
  warning: false           # show warnings
  error: false             # show errors
  message: false           # show messages
  prompt: true
